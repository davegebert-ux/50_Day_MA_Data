name: Daily Scorecard Automation

# ============================================================
# Runs the daily 50-day MA bounce scorecard pipeline automatically:
# pulls fresh market data, then runs the orchestrator (check exits,
# scan for new signals, score, size, and open new trades), then commits
# the updated data and state files back into this repository so
# tomorrow's run picks up exactly where today left off.
#
# SCHEDULING (REWRITTEN 2026-09-22): GitHub does NOT fire scheduled
# workflows on time. Its own docs warn they can be delayed or dropped
# under load, especially at the top of the hour. On Monday 2026-09-21
# the only fires landed at 8:30pm and 1:51am Eastern; the old design
# accepted runs only within 20 minutes of 6pm/8pm, so both were thrown
# away and Monday was never processed.
#
# The fix is to stop depending on WHEN a trigger fires. The workflow now
# fires hourly through the evening plus once the next morning, always at
# :17 past (off the busy top of the hour). pipeline/check_run_window.py
# asks one question: has the most recent FINISHED trading session been
# processed yet (per state/last_run_date.txt)? The first fire that lands
# does the work; every later fire finds it done and exits in seconds.
# Late fires, dropped fires, weekends, holidays and the EDT/EST clock
# change are all handled by that one check, not by the cron lines.
#
# Cron lines are UTC. Eastern evenings Mon-Fri cross midnight UTC, so
# the after-midnight UTC hours must run Tue-Sat to cover Mon-Fri
# evenings. Coverage:
#   EDT (summer): 6:17pm through 1:17am, then 8:17am next morning
#   EST (winter): 5:17pm through 12:17am, then 7:17am next morning
#   (a 5:17pm EST fire is before the 5:30pm ready time and no-ops)
#
# FAILURE EMAILS: a failure before 8pm Eastern stays quiet, because the
# next hourly fire retries it automatically. A failure at 8pm or later
# (including the morning safety-net fire) emails Dave. No summary email
# by the next morning means nothing got through -- check Actions.
#
# WHY STATE GETS COMMITTED BACK: each GitHub Actions run starts from a
# clean checkout of the repo -- nothing persists between runs unless
# it's explicitly committed. Without this commit-back step, the
# orchestrator's state files (open positions, closed trades, last run
# date) and the freshly-pulled data would be thrown away at the end of
# every run, and the next run would have no memory of what happened
# before it.
#
# DUPLICATE SUMMARY EMAILS, THE REAL CAUSE (FIXED 2026-10-15)
# -----------------------------------------------------------
# Dave reported from 2026-10-13 that he was getting each session's
# summary TWICE -- once on its own evening, then again the next day.
# Proven on 2026-10-15 with two mails carrying the identical subject
# "Scorecard Daily Summary -- 2026-10-13", sent 10:55pm Tue Oct 13 and
# 6:34pm Wed Oct 14 Mountain.
#
# The 2026-09-22 note further down claims should_run makes this
# impossible. It does not, and the gap is precise:
#
#   should_run answers "is there an unprocessed session?"
#   the email needs  "was a session just processed?"
#
# Those come apart whenever the orchestrator legitimately DEFERS. On the
# 8:17pm Eastern fire of 2026-10-14 only 17 of 80 live tickers carried a
# bar for that session, so the coverage guard refused to burn the session
# on an unrepresentative slice, left state/last_run_date.txt alone, and
# exited CLEANLY (exit 0 -- a deferral is not a failure). should_run was
# true and correct: 2026-10-14 really was unprocessed. success() was true.
# So the email step ran, read last_run_date.txt, found the PREVIOUS
# session still sitting there, and mailed it a second time. Four hours
# later the data landed, the 12:17am fire processed 2026-10-14 properly,
# and the real mail went out. Two mails, one real.
#
# Note the commit step is no help in spotting this: scripts/pull_data.py
# always writes fresh data/ files, so the commit always has something to
# push (25 files on the run above) even when no session was processed.
#
# THE FIX: read state/last_run_date.txt immediately before and
# immediately after the orchestrator and send the summary only if it
# MOVED. That is the exact question the email needs answered, and the
# file that answers it already exists -- no new state file to keep
# alive across checkouts, and no change to any Python.
#
# Two related notes for whoever reads this next:
#   - Only ONE duplicate arrived per day rather than three because
#     GitHub dropped the 6:17pm and 7:17pm fires entirely. Every evening
#     fire that lands while the data is partial would have sent a copy.
#   - pipeline/send_summary_email.py carries its own last-emailed guard
#     (added 2026-10-14). It is dormant: it stamps state/
#     last_emailed_date.txt AFTER the commit step has already run, so
#     the stamp never survives into the next checkout and the guard
#     always fails open. Harmless, and left in place deliberately -- if
#     it is ever wanted as a real second line of defence it needs its
#     own commit step after the email, not a code change.
# ============================================================

on:
  schedule:
    - cron: '17 22-23 * * 1-5'  # 6:17 & 7:17 PM EDT / 5:17 & 6:17 PM EST, Mon-Fri evenings
    - cron: '17 0-5 * * 2-6'    # 8:17 PM-1:17 AM EDT / 7:17 PM-12:17 AM EST (next UTC day, Tue-Sat)
    - cron: '17 12 * * 2-6'     # 8:17 AM EDT / 7:17 AM EST next-morning safety net, Tue-Sat
  workflow_dispatch:         # allows manually triggering a run from the GitHub UI, for testing
    inputs:
      force_run:
        description: 'Run now even if already up to date (never touches a session whose market has not closed)'
        required: false
        default: false
        type: boolean

# ADDED 2026-09-22: never let two runs overlap. With nine fires a day,
# two delayed fires can land minutes apart; without this, both would read
# the same state, both would process the same days, and the second push
# would collide with the first. This makes the second one wait, then it
# checks out the first one's committed state and finds nothing to do.
concurrency:
  group: daily-scorecard
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed so this workflow can commit state/data back to the repo
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # FIX (2026-09-22): tradingview-screener was missing. scripts/
        # pull_data.py stopped scraping Wikipedia for S&P 400/600 membership
        # on 2026-09-10 and now defines the universe from a live TradingView
        # screen via `from tradingview_screener import Query, Column` -- but
        # this install line was never updated, so the run died with
        # ModuleNotFoundError before pulling a single price. It had never
        # actually surfaced: the old clock-window gate skipped nearly every
        # trigger, so the data-pull step rarely ran at all. Two bugs hid each
        # other; fixing the scheduler exposed this one on the very next run.
        #
        # Version pinned deliberately. This package wraps an API TradingView
        # does not document or guarantee, and an unpinned upgrade could break
        # the universe definition on a random weekday evening with no code
        # change on our side. Bump it consciously, not by accident.
        run: pip install pandas numpy requests lxml "tradingview-screener==3.2.0"

      - name: Determine if this trigger should actually run (has the latest finished session been processed?)
        id: check_time
        run: python3 pipeline/check_run_window.py
        env:
          FORCE_RUN: ${{ github.event.inputs.force_run || 'false' }}

      - name: Pull fresh market data
        if: steps.check_time.outputs.should_run == 'true'
        run: python3 scripts/pull_data.py

      # ADDED 2026-10-15: snapshot the processed-session marker BEFORE the
      # orchestrator touches it. Paired with the check further down, this
      # is what tells the difference between "the orchestrator processed a
      # session" and "the orchestrator looked, deferred, and changed
      # nothing" -- see the DUPLICATE SUMMARY EMAILS note in the header.
      - name: Note which session was already processed before this run
        if: steps.check_time.outputs.should_run == 'true'
        id: before_run
        run: |
          BEFORE="$(cat state/last_run_date.txt 2>/dev/null || true)"
          BEFORE="${BEFORE:-none}"
          echo "date=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "state/last_run_date.txt before the orchestrator: $BEFORE"

      - name: Run orchestrator
        if: steps.check_time.outputs.should_run == 'true'
        id: orchestrator
        run: python3 pipeline/orchestrator.py

      # ADDED 2026-10-15: the gate the summary email actually needs.
      # A deferral (partial data, coverage guard, nothing ready yet) exits
      # 0 and leaves last_run_date.txt untouched, so comparing the file
      # across the orchestrator step answers "did a session get processed"
      # exactly, with no new state and no orchestrator change. On a
      # catch-up run that drains several sessions at once this is still
      # true once, and the email still summarises the LAST day processed.
      - name: Did this run actually process a session?
        if: steps.check_time.outputs.should_run == 'true' && success()
        id: advanced
        env:
          BEFORE: ${{ steps.before_run.outputs.date }}
        run: |
          AFTER="$(cat state/last_run_date.txt 2>/dev/null || true)"
          AFTER="${AFTER:-none}"
          echo "state/last_run_date.txt after the orchestrator: $AFTER (was $BEFORE)"
          if [ "$AFTER" != "$BEFORE" ]; then
            echo "advanced=true" >> "$GITHUB_OUTPUT"
            echo "A session was processed -- the summary email will be sent."
          else
            echo "advanced=false" >> "$GITHUB_OUTPUT"
            echo "No session was processed -- the orchestrator deferred this one."
            echo "Suppressing the summary email so the previous session is not re-sent."
          fi

      - name: Commit updated data and state files back to the repo
        if: steps.check_time.outputs.should_run == 'true' && success()
        run: |
          git config user.name "scorecard-automation-bot"
          git config user.email "actions@github.com"
          # FIX (2026-09-06): "git add" errors out with "pathspec did not
          # match any files" if a folder exists but is completely empty
          # (git does not track empty directories) -- this happens
          # legitimately on days the market is closed or no trades
          # occurred, since state/ gets created but nothing gets written
          # into it. "|| true" makes that a harmless no-op instead of a
          # hard failure. Commit and push only happen inside the "else"
          # branch below, i.e. only if there's actually something staged.
          git add data/ state/ || true
          if git diff --cached --quiet; then
            echo "No changes to commit -- nothing new from today's run (normal on non-trading days)."
          else
            git commit -m "Automated daily update: $(date -u +'%Y-%m-%d %H:%M UTC')"
            # ADDED 2026-09-22: pick up any commit Dave made to main while
            # this run was working (e.g. pasting an updated pipeline file),
            # so the push isn't rejected. The bot only writes data/ and
            # state/, Dave only edits code and docs, so these never overlap.
            # FIX (2026-09-22, same evening): the line above was
            # "git pull --rebase origin main" and it failed with
            # "cannot pull with rebase: You have unstaged changes."
            # "git add data/ state/" stages only those two folders, so any
            # tracked file the run touches OUTSIDE them stays dirty in the
            # working tree, and rebase refuses to start on a dirty tree.
            # --autostash tells git to stash whatever is left, rebase, then
            # put it back, which is exactly the desired behaviour here: that
            # leftover is incidental, it is not what we are committing.
            # The status line below is logged so the next failure names the
            # offending file instead of leaving us guessing.
            echo "Working tree state before rebase:"
            git status --porcelain
            # FIX (2026-09-22, third attempt): this said "origin main" and
            # died with "fatal: couldn't find remote ref main". The branch
            # is named "Main" with a capital M -- visible in git's own commit
            # line, "[Main 2a28719]". Git branch names are case-sensitive, so
            # "main" is simply a branch that does not exist. Nothing else in
            # the workflow had ever named the branch explicitly (checkout and
            # push both infer it), so the typo could not surface until the
            # rebase line was added earlier today.
            # Rather than hardcode "Main" and depend on the capitalisation
            # never changing, ask git what branch we are actually on.
            BRANCH="$(git rev-parse --abbrev-ref HEAD)"
            echo "Rebasing onto origin/$BRANCH"
            git pull --rebase --autostash origin "$BRANCH"
            git push
          fi

      - name: Send failure notification email (only if it failed at or after 8pm Eastern)
        if: steps.check_time.outputs.should_run == 'true' && steps.check_time.outputs.is_retry_slot == 'true' && failure()
        run: python3 pipeline/send_failure_email.py
        env:
          EMAIL_ADDRESS: ${{ secrets.SCORECARD_EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.SCORECARD_EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.SCORECARD_EMAIL_TO }}

      # DUPLICATE-EMAIL NOTE (2026-09-13, updated 2026-09-22, CORRECTED
      # 2026-10-15): on 2026-09-12 both the primary and the retry sent an
      # identical summary, because the old clock-window design couldn't
      # tell a quiet successful run from a run that never happened. The
      # 2026-09-22 design gated this step on should_run and this note
      # then claimed "exactly one run per session reaches this step."
      # That claim was WRONG and the duplicates continued for a month:
      # should_run is true whenever a session is unprocessed, including
      # on every run where the orchestrator defers it for partial data.
      # Such a run reaches this step with last_run_date.txt still holding
      # the PREVIOUS session, and mails that session again. The real gate
      # is steps.advanced -- did last_run_date.txt actually move -- and
      # it is now required below. Full account in the header.
      #
      # When a run catches up several days at once, the email summarizes
      # the LAST day processed; the earlier days are in
      # state/daily_funnel.csv.
      - name: Send daily summary email (only when a session was actually processed)
        if: steps.check_time.outputs.should_run == 'true' && steps.advanced.outputs.advanced == 'true' && success()
        run: python3 pipeline/send_summary_email.py
        env:
          EMAIL_ADDRESS: ${{ secrets.SCORECARD_EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.SCORECARD_EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.SCORECARD_EMAIL_TO }}
